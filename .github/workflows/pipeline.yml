name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        python -m pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:v${{ github.run_number }}

    - name: Create Local KinD Kubernetes Cluster
      uses: engineerd/setup-kind@v0.5.0
      with:
        version: "v0.11.1"

    - name: Update Kubernetes Manifest with Unique Tag
      run: |
        sed -i 's/__IMAGE_TAG__/v'${{ github.run_number }}'/g' deployment.yaml
        sed -i 's/DOCKERHUB_USERNAME/'${{ secrets.DOCKERHUB_USERNAME }}'/g' deployment.yaml

    - name: Deploy to Kubernetes Cluster via Kubectl
      run: |
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml

    - name: Verify Live Deployment Status
      run: |
        kubectl get deployments
        kubectl get pods
        kubectl get service calculator-service
