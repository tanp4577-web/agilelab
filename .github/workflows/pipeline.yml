name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        PYTHONPATH=. python -m pytest

    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: tanp77
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: tanp77/calculator-app:v${{ github.run_number }}

    
    - name: Run Web Container Simulation
      run: |
        docker rm -f calculator-local-run || true
        docker run -d -p 8080:80 --name calculator-local-run tanp77/calculator-app:v${{ github.run_number }}
        echo "Successfully deployed version v${{ github.run_number }} onto localhost port 8080"
