apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
  labels:
    app: calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
      - name: calculator
        image: DOCKERHUB_USERNAME/calculator-app:__IMAGE_TAG__
        ports:
        - containerPort: 80
        stdin: true
        tty: true
